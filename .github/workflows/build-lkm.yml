name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      yukizygisk:
        description: 'Enable YukiZygisk kernel hooks'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      yukizygisk:
        description: 'Enable YukiZygisk kernel hooks'
        required: false
        default: false
        type: boolean
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-lkm:
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with scripts/build.* and ksud.yml.
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm.yml
    secrets: inherit
    with:
      kmi: ${{ matrix.kmi }}
      yukizygisk: ${{ inputs.yukizygisk }}
